[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doneguard"
version = "0.1.0"
description = "Your AI coding agent can't say \"done\" until the checks pass."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["claude-code", "cursor", "codex", "gemini-cli", "copilot", "aider", "ai-agents", "coding-agent", "hooks", "harness", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/abranchesia/doneguard"
Issues = "https://github.com/abranchesia/doneguard/issues"

[project.scripts]
doneguard = "doneguard:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.sdist]
exclude = ["demo", ".github"]
